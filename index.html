      function escapeHtml(str) {
        return String(str || '').replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
      }

      function sanitizeImdbCode(rawCode) {
        if (!rawCode) return '';
        let code = String(rawCode).trim();
        const match = code.match(/(tt\d{6,9})/i);
        return match ? match[1].toLowerCase() : (/^\d{6,9}$/.test(code) ? 'tt' + code : '');
      }

      function normalizeMovie(m) {
        const imdb = sanitizeImdbCode(m.imdb_code || m.id || m.imdbID);
        return {
          id: m.id || imdb, imdb_code: imdb,
          title: m.title || m.name || 'Untitled',
          year: m.year || m.releaseInfo || '2024',
          rating: m.rating || m.imdbRating || '7.5',
          runtime: m.runtime || '120 min',
          genres: Array.isArray(m.genres) ? m.genres : ['Movie'],
          poster: m.poster || m.large_cover_image || 'https://images.metahub.space/poster/medium/placeholder/img',
          backdrop: m.backdrop || m.background || m.poster || '',
          summary: m.summary || m.description || 'Watch full movie in HD quality.'
        };
      }

              '<span class="inline-block mb-2 font-mono text-xs font-semibold text-neonCyan uppercase">★ ' + escapeHtml(movie.rating) + ' IMDb Rating</span>' +
              '<h1 class="font-display text-3xl font-extrabold text-white sm:text-5xl">' + escapeHtml(movie.title) + '</h1>' +
              '<p class="mt-3 max-w-xl text-sm text-slate-300 line-clamp-3">' + escapeHtml(movie.summary) + '</p>' +
              '<div class="mt-5"><button type="button" id="heroWatchBtn" class="rounded-xl bg-crimson px-6 py-3 text-sm font-bold text-white shadow-lg">Watch Now</button></div>' +

          '<article data-movie-index="' + index + '" role="button" class="catalog-card group relative flex cursor-pointer flex-col overflow-hidden rounded-xl border border-white/10 bg-white/5 backdrop-blur-xl transition-all hover:-translate-y-1 hover:border-cyan-400/45">' +
            '<div class="relative aspect-[2/3] w-full overflow-hidden bg-slate-900">' +
              '<img src="' + escapeHtml(movie.poster) + '" alt="' + escapeHtml(movie.title) + '" loading="lazy" class="h-full w-full object-cover transition-transform group-hover:scale-105" onerror="this.src=\'https://images.metahub.space/poster/medium/placeholder/img\'" />' +
            '</div>' +
            '<div class="p-3">' +
              '<h3 class="truncate font-display text-sm font-semibold text-white">' + escapeHtml(movie.title) + '</h3>' +
              '<div class="mt-1 flex items-center gap-1 font-mono text-xs text-slate-400"><span class="text-amber-300">★ ' + escapeHtml(movie.rating) + '</span><span>·</span><span>' + escapeHtml(movie.year) + '</span></div>' +
            '</div>' +
          '</article>'
        );
      }

      function renderCatalog(movies) {
        state.visibleMovies = movies;
        catalogCountLabel.textContent = movies.length + ' movies';
        if (movies.length === 0) {
          catalogFirstGrid.innerHTML = '<p class="text-center text-slate-400 py-12">No movies found.</p>';
          catalogMiddleGrid.classList.add('hidden');
          return;
        }
        let html = '<div class="grid grid-cols-2 gap-3.5 sm:grid-cols-3 sm:gap-5 md:grid-cols-4 lg:grid-cols-5 xl:grid-cols-6">';
        movies.slice(0, 12).forEach((m, i) => { html += createCardHtml(m, i); });
        html += '</div>';
        catalogFirstGrid.innerHTML = html;
        bindCards(catalogFirstGrid);

        const rest = movies.slice(12);
        if (rest.length > 0) {
          let midHtml = '<div class="grid grid-cols-2 gap-3.5 sm:grid-cols-3 sm:gap-5 md:grid-cols-4 lg:grid-cols-5 xl:grid-cols-6">';
          rest.forEach((m, i) => { midHtml += createCardHtml(m, i + 12); });
          midHtml += '</div>';
          catalogMiddleGrid.innerHTML = midHtml;
          catalogMiddleGrid.classList.remove('hidden');
          bindCards(catalogMiddleGrid);
        } else {
          catalogMiddleGrid.classList.add('hidden');
        }
      }

      function bindCards(container) {
        container.querySelectorAll('.catalog-card').forEach(card => {
          card.addEventListener('click', () => {
            const idx = parseInt(card.getAttribute('data-movie-index'), 10);
            const movie = state.visibleMovies[idx];
            if (movie) openPlayerModal(movie);
          });
        });
      }

      async function loadMovies() {
        catalogFirstGrid.innerHTML = '<div class="grid grid-cols-2 gap-3.5 sm:grid-cols-3 md:grid-cols-4 lg:grid-cols-6">' + '<div class="aspect-[2/3] bg-slate-900 skeleton-shimmer rounded-xl"></div>'.repeat(6) + '</div>';
        try {
          let url = 'https://cinemeta-catalogs.strem.io/top/catalog/movie/top.json';
          if (state.searchQuery) {
            url = 'https://v3-cinemeta.strem.io/catalog/movie/top/search=' + encodeURIComponent(state.searchQuery) + '.json';
          }
          const res = await fetch(url);
          const json = await res.json();
          if (json && Array.isArray(json.metas) && json.metas.length > 0) {
            const movies = json.metas.map(normalizeMovie);
            state.movies = movies;
            renderHero(movies[0]);
            renderCatalog(movies);
            return;
          }
          throw new Error('API empty');
        } catch (e) {
          // কোনো কারণে API ফেইল করলে আমাদের সমৃদ্ধ ফলব্যাক মুভি লিস্ট দেখাবে (যাতে ভরপুর মুভি থাকে)
          state.movies = FALLBACK_MOVIES.map(normalizeMovie);
          renderHero(state.movies[0]);
          renderCatalog(state.movies);
        }
      }

      function openPlayerModal(movie) {
        state.activeMovie = movie;
        modalTitle.textContent = movie.title;
        modalMeta.textContent = '★ ' + movie.rating + ' IMDb · ' + movie.runtime;
        loadServerStream(1);
        playerModal.classList.remove('hidden');
        playerModal.classList.add('flex');
      }

      function loadServerStream(serverNum) {
        state.activeServer = serverNum;
        serverButtons.forEach((btn, idx) => {
          if (btn) btn.classList.toggle('border-cyan-400', idx + 1 === serverNum);
        });
        const imdb = sanitizeImdbCode(state.activeMovie && state.activeMovie.imdb_code);
        if (!imdb) return;
        const srv = EMBED_SERVERS[serverNum - 1] || EMBED_SERVERS[0];
        playerIframe.src = srv.buildUrl(encodeURIComponent(imdb));
      }

      function closePlayerModal() {
        playerIframe.src = 'about:blank';
        playerModal.classList.add('hidden');
        playerModal.classList.remove('flex');
      }

      // Events
      categoryTabs.forEach(tab => {
        tab.addEventListener('click', () => {
          state.activeCategory = tab.getAttribute('data-category');
          state.searchQuery = '';
          loadMovies();
        });
      });

      brandHomeBtn.addEventListener('click', (e) => { e.preventDefault(); state.searchQuery = ''; loadMovies(); });
      closePlayerBtn.addEventListener('click', closePlayerModal);

      serverButtons.forEach((btn, idx) => {
        if (btn) btn.addEventListener('click', () => loadServerStream(idx + 1));
      });

      searchForm.addEventListener('submit', (e) => {
        e.preventDefault();
        state.searchQuery = searchInput.value.trim();
        loadMovies();
      });

      loadMovies();
    })();
  </script>
</body>
</html>
